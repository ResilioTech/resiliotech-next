<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="560" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  <!-- Cost chart bars -->
  <g transform="translate(400,160)" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.3">
    <rect x="0" y="80" width="50" height="120" rx="4" fill="#6366f1" fill-opacity="0.15"/>
    <rect x="70" y="50" width="50" height="150" rx="4" fill="#6366f1" fill-opacity="0.15"/>
    <rect x="140" y="100" width="50" height="100" rx="4" fill="#6366f1" fill-opacity="0.15"/>
    <rect x="210" y="30" width="50" height="170" rx="4" fill="#6366f1" fill-opacity="0.15"/>
    <rect x="280" y="70" width="50" height="130" rx="4" fill="#6366f1" fill-opacity="0.15"/>
    <!-- Trend line -->
    <polyline points="25,80 95,50 165,100 235,30 305,70" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
  </g>
  <text x="60" y="520" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#ffffff">AWS Cost Optimization</text>
  <text x="60" y="560" font-family="system-ui,sans-serif" font-size="18" fill="#9ca3af">Resilio Tech • Strategy</text>
</svg>
